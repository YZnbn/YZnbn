# Stock Thermometer v3 - 因果因子选股器
# PCMCI 因果推断驱动的 A 股智能选股工具

# 市场参数
market:
  index: "000300"
  ma_period: 60
  vol_period: 20

# 因子参数
factors:
  momentum:
    periods: [20, 60, 120]
    skip: 5
  value:
    pe_inverse: true
    pb_inverse: true
  quality:
    roe_min: 0
  low_vol:
    periods: [20, 60]
  liquidity:
    turnover_period: 20
    volume_ratio_short: 5
    volume_ratio_long: 20
  sentiment:
    rsi_period: 14
    pos_52w_lookback: 252

# 因子类别（用于短线/长线分类）
factor_categories:
  short_term: [mom_20d, mom_60d, mom_120d, turnover_20d, volume_ratio, rsi_14]
  long_term: [pe_inv, pb_inv, roe, gross_margin, vol_20d, vol_60d]

# PCMCI 参数
pcmci:
  tau_max: 5
  pc_alpha: 0.1
  fdr_method: "fdr_bh"        # Benjamini-Hochberg
  min_causal_factors: 3       # 最少保留的因子数（不够则放宽 p 值）
  lookback_days: 120
  target_forward_days: 20

# 体温判市
regime:
  bull:
    momentum_boost: 1.3
    value_penalty: 0.8
  sideways:
    momentum_boost: 1.0
    value_penalty: 1.0
  bear:
    momentum_boost: 0.8
    value_penalty: 1.3

# 选股参数
scoring:
  top_n: 5
  short_term_threshold: 0.6
  long_term_threshold: 0.4

# 资金适配
budget:
  lot_size: 100
  etf_alternatives:
    - {code: "159919", name: "沪深300ETF"}
    - {code: "510050", name: "上证50ETF"}
    - {code: "159915", name: "创业板ETF"}

# 数据
data:
  cache_dir: "cache"
  max_stocks: 5000
  exclude_st: true
  exclude_new_ipo_days: 60
  min_price: 1.0

# 回测
backtest:
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  initial_capital: 100000
  rebalance_freq: 20
  commission: 0.0003
  slippage: 0.001
